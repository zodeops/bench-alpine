name: Run Tests
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label for every job
        default: ubuntu-latest

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run vitest
